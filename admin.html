

<!DOCTYPE html>

<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Jain Rishta Setu Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{font-family:Arial;background:#f5f1eb;padding:20px}

.box{max-width:700px;margin:auto;background:white;padding:22px;border-radius:15px}

input,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box}

button{background:#681d35;color:white;border:0;border-radius:8px}

.profile{padding:12px;border-bottom:1px solid #ddd}


/* ===== ADMIN PREMIUM SKIN ===== */
:root{--wine:#3b0718;--maroon:#64152f;--gold:#c9a24a;--cream:#fffaf2}
*{box-sizing:border-box}
body{font-family:Georgia,serif!important;background:linear-gradient(135deg,#fffaf2,#f1e5d7)!important;color:#321a20}
.box{max-width:900px!important;background:#fffdf8!important;border:1px solid var(--gold);border-radius:22px!important;box-shadow:0 14px 36px #3b07181c;padding:clamp(18px,4vw,34px)!important}
h2,h3{color:var(--wine)}
input{border:1px solid #d8c49a!important;border-radius:12px!important;background:#fffefa}
button{background:linear-gradient(135deg,#8a344d,var(--wine))!important;color:#fff2cf!important;border:1px solid var(--gold)!important;border-radius:999px!important;font-weight:bold;cursor:pointer}
.profile{background:#fffaf0;border:1px solid #e1c98f;border-radius:16px;margin:14px 0;padding:18px;line-height:1.8;overflow-wrap:anywhere}
.profile img{max-width:130px;max-height:130px;object-fit:cover;border:2px solid var(--gold)}
a{color:var(--maroon);font-weight:bold}

</style>

</head>

<body>

<div class="box">

<h2>Jain Rishta Setu</h2>

<h3>Admin Login</h3>

<input id="email" type="email" placeholder="Admin Email">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<button onclick="logout()">Logout</button>

<h3>Registered Profiles</h3>

<div id="result">Login करके प्रोफाइल देखें।</div>
<h3>Membership Payment Requests</h3>

<div id="payments">भुगतान की जानकारी लोड हो रही है...</div>
</div>

<script>

const supabaseUrl = "https://fumusgxzafvluidpjxqc.supabase.co";

const supabaseKey = "sb_publishable_wQ98cLAS75kE_vbpeduhaA_ZNdtNh96";

const db = window.supabase.createClient(supabaseUrl,supabaseKey);

async function login(){

const {data,error}=await db.auth.signInWithPassword({

email:document.getElementById("email").value,

password:document.getElementById("password").value

});

if(error){alert(error.message);return;}

loadProfiles();
loadPayments();
}

async function loadProfiles(){

const {data,error}=await db.from("profiles").select("*");

if(error){alert(error.message);return;}

document.getElementById("result").innerHTML="";

for (const p of data) {
let photoUrl = "";
if (p.profile_photo) {
  const { data: photo } = await db.storage
    .from("Profile Photo")
    .createSignedUrl(p.profile_photo, 3600);

  if (photo) photoUrl = photo.signedUrl;
}
let biodataUrl = "";

if (p.biodata_url) {
  const { data: biodata } = await db.storage
    .from("Member Biodata")
    .createSignedUrl(p.biodata_url, 3600);

  if (biodata) biodataUrl = biodata.signedUrl;
}  
document.getElementById("result").innerHTML+=`

<div class="profile">
${photoUrl ? `<img src="${photoUrl}" width="100" style="border-radius:10px"><br>` : ""}
<b>${p.full_name||""}</b><br>

मोबाइल: ${p.mobile||""}<br>

शहर: ${p.city||""}<br>

राज्य: ${p.state||""}<br>

शिक्षा: ${p.education||""}<br>

व्यवसाय: ${p.occupation||""}<br>
पिता: ${p.father_name||"—"} | माता: ${p.mother_name||"—"}<br>
गोत्र: ${p.gotra||"—"} | संप्रदाय: ${p.sampraday||"—"} ${p.sub_sampraday||""}<br>
वैवाहिक स्थिति: ${p.marital_status||"—"} | जन्म तारीख: ${p.date_of_birth||"—"}<br>
लंबाई: ${p.height||"—"} | भाई: ${p.brothers??"—"} | बहनें: ${p.sisters??"—"}<br>
पिता का व्यवसाय: ${p.father_occupation||"—"} | माता का व्यवसाय: ${p.mother_occupation||"—"}<br>
मूल निवास: ${p.family_origin||"—"}<br>
परिवार परिचय: ${p.family_description||"—"}<br>
जन्म समय/स्थान: ${p.birth_time||"—"} / ${p.birth_place||"—"} | राशि: ${p.rashi||"—"}<br>
कुंडली: ${p.kundli_available||"—"}<br>
जीवनसाथी की पसंद: ${p.partner_age_preference||"—"}; ${p.partner_education_preference||"—"}; ${p.partner_location_preference||"—"}<br>
अन्य अपेक्षाएँ: ${p.partner_expectations||"—"}
<br><br>
${biodataUrl ? `<a href="${biodataUrl}" target="_blank">बायोडाटा देखें / डाउनलोड करें</a><br>` : "बायोडाटा उपलब्ध नहीं"} 
स्थिति: ${p.approval_status || "pending"}<br>

<button onclick="updateStatus('${p.id}','approved')">Approve</button>

<button onclick="updateStatus('${p.id}','rejected')">Reject</button>
</div>`;

}

}

async function logout(){

await db.auth.signOut();

document.getElementById("result").innerHTML="आप Logout हो गए हैं।";

}
async function updateStatus(id, status){
  const {error} = await db
    .from("profiles")
    .update({
      approval_status: status,
      is_approved: status === "approved"
    })
    .eq("id", id);

  if(error){
    alert(error.message);
    return;
  }

  alert("Profile updated!");
  loadProfiles();
}
async function loadPayments(){
  const {data,error} = await db
    .from("membership_payments")
    .select("*")
    .order("created_at",{ascending:false});

  const box = document.getElementById("payments");
  if(!box) return;

  if(error){
    box.textContent = "Payment error: " + error.message;
    return;
  }

  box.innerHTML = "";

  if(!data || data.length === 0){
    box.textContent = "अभी कोई भुगतान अनुरोध नहीं है।";
    return;
  }

  data.forEach(async p=>{
    const card = document.createElement("div");
    card.className = "profile";
    card.textContent =
      "नाम: " + p.full_name +
      " | मोबाइल: " + p.mobile +
      " | प्लान: " + p.plan +
      " | स्थिति: " + p.status;
    if (p.screenshot_url) {
  const { data: fileData } = await db.storage
    .from("Member Biodata")
    .createSignedUrl(p.screenshot_url, 3600);

  if (fileData) {
    const link = document.createElement("a");
    link.href = fileData.signedUrl;
    link.target = "_blank";
    link.textContent = "Payment Screenshot खोलें";
    card.appendChild(link);
  }
}
  
    
  

    const approveBtn = document.createElement("button");
approveBtn.textContent = "Approve Payment";
approveBtn.onclick = () => updatePaymentStatus(p.id, "approved");
card.appendChild(approveBtn);

const rejectBtn = document.createElement("button");
rejectBtn.textContent = "Reject Payment";
rejectBtn.onclick = () => updatePaymentStatus(p.id, "rejected");
card.appendChild(rejectBtn);
    box.appendChild(card);
  });
}
async function updatePaymentStatus(id, status) {
  const { error } = await db
    .from("membership_payments")
    .update({ status: status })
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  alert("Payment status updated!");
  loadPayments();
}
</script>

</body>

</html>
