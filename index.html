<!DOCTYPE html>

<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jain Rishta Setu</title>

<style>

body{margin:0;font-family:Arial;background:#fffaf2;color:#333;text-align:center}

header{background:#6b1535;color:white;padding:25px}

h1{margin:0;color:#f8dfaa}

.hero{padding:55px 15px;background:#f7ead8}

button{background:#8c2448;color:white;border:0;padding:13px 25px;border-radius:7px;margin:10px}

section{padding:25px}
.profile{
  background:white;
  border-radius:16px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 4px 15px #0002;
  border:1px solid #ead5dc;
}

#approved h2{
  color:#681d35;
  text-align:center;
  margin-bottom:20px;
}

#approvedProfiles{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:18px;
}
</style>

</head>

<body>

<header>

<h1>Jain Rishta Setu</h1>

<p>जैन समाज के रिश्तों का अपना विश्वसनीय मंच</p>

</header>

<div class="hero">

<h2>जैन की शादी, जैन में</h2>

<p>एक पवित्र रिश्ता, एक सुंदर जीवन की शुरुआत</p>

<button onclick="document.getElementById('register').scrollIntoView()">रजिस्ट्रेशन करें</button>

</div>

<section id="register">

<h2>निःशुल्क रजिस्ट्रेशन</h2>

<p>अपनी जानकारी भरें और अपना जीवनसाथी खोजें।</p>

<form id="registerForm">

<input type="text" name="full_name" placeholder="पूरा नाम" required>

<select name="gender" required>

<option value="">लिंग चुनें</option>

<option value="Male">पुरुष</option>

<option value="Female">महिला</option>

</select>

<input type="tel" name="mobile" placeholder="मोबाइल नंबर" required>

<input type="text" name="city" placeholder="शहर" required>

<input type="text" name="state" placeholder="राज्य" required>

<input type="text" name="education" placeholder="शिक्षा">

<input type="text" name="occupation" placeholder="व्यवसाय">

<button type="submit">रजिस्ट्रेशन करें</button>
<label>प्रोफाइल फोटो अपलोड करें</label>

<input type="file" id="profilePhoto" name="profilePhoto" accept="image/*">
</form>

</section>









<footer>© Jain Rishta Setu</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://fumusgxzafvluidpjxqc.supabase.co";

const supabaseKey = "sb_publishable_wQ98cLAS75kE_vbpeduhaA_ZNdtNh96";

const db = window.supabase.createClient(supabaseUrl, supabaseKey);

document.getElementById("registerForm").addEventListener("submit", async function(e) {

  e.preventDefault();

  const formData = new FormData(this);
const photoFile = document.getElementById("profilePhoto").files[0];

let photoUrl = "";

if (photoFile) {
  const fileName = Date.now() + "_" + photoFile.name;

  const { data: uploadData, error: uploadError } = await db.storage
    .from("Profile Photo")
    .upload(fileName, photoFile);

  if (uploadError) {
    alert("फोटो अपलोड नहीं हुई: " + uploadError.message);
    return;
  }

  photoUrl = fileName;
}
  const profile = {
profile_photo: photoUrl,
    full_name: formData.get("full_name"),

    gender: formData.get("gender"),

    mobile: formData.get("mobile"),

    city: formData.get("city"),

    state: formData.get("state"),

    education: formData.get("education"),

    occupation: formData.get("occupation")

  };

  const { error } = await db.from("profiles").insert([profile]);

  if (error) {

    alert("Registration failed: " + error.message);

  } else {

    alert("रजिस्ट्रेशन सफल हुआ!");

    this.reset();

  }

});
async function loadApprovedProfiles(){
  const {data,error} = await db
    .from("approved_profiles")
    .select("*");

  const box = document.getElementById("approvedProfiles");

  if(error){
    box.textContent = "रिश्ते लोड नहीं हो पाए।";
    return;
  }

  box.innerHTML = "";

  data.forEach(p=>{
    const card = document.createElement("div");
    card.className = "profile";
    card.textContent =
      p.full_name + " | " + p.gender + " | " +
      p.city + " | " + p.state + " | " + p.education;
    box.appendChild(card);
  });
}

document.addEventListener("DOMContentLoaded", loadApprovedProfiles);
</script>





<section id="approved">

  <h2>Verified Jain Profiles</h2>

  <div id="approvedProfiles">रिश्ते लोड हो रहे हैं...</div>

</section>
</body>

</html>
